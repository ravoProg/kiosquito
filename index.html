<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosquito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="heart.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdf2f8; /* Soft pink background fallback */
            background-image: radial-gradient(at 0% 0%, hsla(339, 100%, 95%, 1) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, hsla(39, 100%, 93%, 1) 0px, transparent 50%);
            min-height: 100vh;
        }
        
        /* Custom scrollbar for cuteness */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fdf2f8; 
        }
        ::-webkit-scrollbar-thumb {
            background: #f9a8d4; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f472b6; 
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
        }
        .toast-enter-active {
            transform: translateY(0);
            opacity: 1;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast-leave-active {
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s ease-in;
        }

        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-scale-in {
            animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="text-slate-700 overflow-x-hidden">

    <!-- Header / Balance -->
    <header class="glass-header sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto px-6 py-4 flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-rose-500 tracking-wide">Kiosquito 💝</h1>
            
            <div class="flex items-center gap-2 md:gap-3 flex-wrap">
                <button onclick="earnPoints()" class="px-4 py-2 bg-teal-50 hover:bg-teal-100 text-teal-600 border border-teal-200 rounded-full text-sm font-semibold transition-colors flex items-center gap-1 shadow-sm active:scale-95">
                    <span>🎁</span> Ganar Puntos
                </button>
                <button onclick="resetApp()" class="px-4 py-2 bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 rounded-full text-sm font-semibold transition-colors flex items-center gap-1 shadow-sm active:scale-95">
                    <span>🔄</span> Reiniciar
                </button>

                <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm border border-rose-100 md:ml-2">
                    <span class="text-xl">✨</span>
                    <span class="font-medium text-slate-700 hidden sm:inline">Saldo:</span>
                    <span id="balance-display" class="font-bold text-rose-500 text-lg transition-all duration-300">1000</span>
                    <span class="text-sm font-medium text-slate-500 hidden sm:inline">Monedas</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-6 py-12">
        <div class="text-center mb-12">
            <h2 class="text-4xl md:text-5xl font-bold text-slate-800 mb-4">¿Qué se te antoja hoy?</h2>
            <p class="text-lg text-slate-500 max-w-2xl mx-auto">Canjea tus moneditas por vouchers. ¡Elejilos con sabiduría (o úsalos todos)! 🥰</p>
        </div>

        <!-- Vouchers Grid -->
        <div id="vouchers-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Vouchers will be injected here via JS -->
        </div>

        <!-- Cart Section -->
        <div class="mt-16 bg-white/50 backdrop-blur-md rounded-3xl p-8 border border-rose-100 shadow-sm relative overflow-hidden">
            <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-pink-100 rounded-full opacity-50"></div>
            <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center relative z-10">Tus Vouchers Canjeados 🎒</h2>
            
            <div id="cart-container" class="flex flex-wrap gap-4 justify-center relative z-10 min-h-[60px] items-center">
                <!-- Cart items will be injected here via JS -->
            </div>
        </div>
    </main>

    <!-- Custom Toast Notification -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none">
        <!-- Toasts go here -->
    </div>

    <script>
        // State
        const defaultBalance = 1000;
        let currentBalance = defaultBalance;
        let myCart = [];

        // Voucher Data
        const vouchers = [
            {
                id: 1,
                title: "Voucher por una comida",
                description: "Una cena o almuerzo a elección. ¡Invito o cocino yo!",
                cost: 300,
                icon: "🍔",
                color: "bg-orange-100",
                textColor: "text-orange-500"
            },
            {
                id: 2,
                title: "Voucher por una merienda",
                description: "Cafecito, medialunas o algo rico para la tarde.",
                cost: 150,
                icon: "☕",
                color: "bg-amber-100",
                textColor: "text-amber-600"
            },
            {
                id: 3,
                title: "Voucher por una siesta",
                description: "Sin que jodan, abrazos opcionales pero recomendados.",
                cost: 500,
                icon: "💤",
                color: "bg-indigo-100",
                textColor: "text-indigo-500"
            },
            {
                id: 4,
                title: "Voucher por un maratón de películas",
                description: "Sillon, mantita, chocolate y unas buenas pelis.",
                cost: 400,
                icon: "🍿",
                color: "bg-red-100",
                textColor: "text-red-500"
            }
        ];

        // DOM Elements
        const balanceDisplay = document.getElementById('balance-display');
        const vouchersGrid = document.getElementById('vouchers-grid');
        const toastContainer = document.getElementById('toast-container');
        const cartContainer = document.getElementById('cart-container');

        // Render Vouchers
        function renderVouchers() {
            vouchersGrid.innerHTML = '';
            vouchers.forEach(voucher => {
                const card = document.createElement('div');
                card.className = `bg-white rounded-3xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-rose-50 flex flex-col items-center text-center transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_20px_40px_rgba(244,114,182,0.15)] relative overflow-hidden group`;
                
                card.innerHTML = `
                    <!-- Decorative blob -->
                    <div class="absolute -top-10 -right-10 w-24 h-24 bg-rose-50 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                    
                    <div class="${voucher.color} w-20 h-20 rounded-2xl flex items-center justify-center text-4xl mb-4 shadow-inner relative z-10">
                        ${voucher.icon}
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2 relative z-10">${voucher.title}</h3>
                    <p class="text-sm text-slate-500 mb-6 flex-grow relative z-10">${voucher.description}</p>
                    
                    <div class="w-full mt-auto relative z-10">
                        <div class="flex items-center justify-center gap-1 mb-3 text-rose-500 font-semibold">
                            <span>${voucher.cost}</span>
                            <span class="text-xs">monedas</span>
                        </div>
                        <button onclick="redeemVoucher(${voucher.id})" class="w-full py-3 px-4 bg-rose-400 hover:bg-rose-500 text-white rounded-xl font-medium transition-colors shadow-md shadow-rose-200 active:scale-95 transform">
                            Canjear
                        </button>
                    </div>
                `;
                vouchersGrid.appendChild(card);
            });
        }

        // Redeem Logic
        function redeemVoucher(id) {
            const voucher = vouchers.find(v => v.id === id);
            if (!voucher) return;

            if (currentBalance >= voucher.cost) {
                // Success
                currentBalance -= voucher.cost;
                myCart.push(voucher);
                updateBalanceDisplay();
                renderCart();
                showToast(`¡Canjeaste "${voucher.title}"! 🎉`, 'success');
            } else {
                // Insufficient funds
                showToast(`Saldo insuficiente para "${voucher.title}" 🥺`, 'error');
            }
        }

        // Update UI Balance with animation
        function updateBalanceDisplay() {
            balanceDisplay.style.transform = 'scale(1.3)';
            balanceDisplay.style.color = '#fb7185'; // lighter rose
            setTimeout(() => {
                balanceDisplay.innerText = currentBalance;
                balanceDisplay.style.transform = 'scale(1)';
                balanceDisplay.style.color = '#f43f5e'; // normal rose
            }, 150);
        }

        // Custom Toast Notification System
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            
            // Base classes
            toast.className = `toast-enter flex items-center gap-3 px-6 py-4 rounded-2xl shadow-xl border pointer-events-auto max-w-sm`;
            
            if (type === 'success') {
                toast.classList.add('bg-white', 'border-rose-100', 'text-slate-700');
                toast.innerHTML = `
                    <div class="bg-green-100 text-green-500 rounded-full w-8 h-8 flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <p class="font-medium">${message}</p>
                `;
            } else {
                toast.classList.add('bg-white', 'border-red-100', 'text-slate-700');
                toast.innerHTML = `
                    <div class="bg-red-100 text-red-500 rounded-full w-8 h-8 flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </div>
                    <p class="font-medium">${message}</p>
                `;
            }

            toastContainer.appendChild(toast);

            // Trigger enter animation
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });

            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.classList.add('toast-leave-active');
                
                // Remove from DOM after leave animation completes
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        // New Features Logic
        function earnPoints() {
            currentBalance += 100;
            updateBalanceDisplay();
            showToast('¡Recibiste 100 moneditas extra! 🎁', 'success');
        }

        function resetApp() {
            currentBalance = defaultBalance;
            myCart = [];
            updateBalanceDisplay();
            renderCart();
            showToast('Todo volvió a empezar 🔄', 'success');
        }

        function renderCart() {
            if (myCart.length === 0) {
                cartContainer.innerHTML = '<p class="text-slate-400 font-medium italic animate-scale-in">Aún no tienes vales... ¡Anímate a canjear algo!</p>';
                return;
            }

            cartContainer.innerHTML = '';
            
            // Group the cart items by ID to show quantities
            const groupedCart = {};
            myCart.forEach(v => {
                if(!groupedCart[v.id]) {
                    groupedCart[v.id] = { ...v, quantity: 0 };
                }
                groupedCart[v.id].quantity += 1;
            });

            // Render each grouped item
            Object.values(groupedCart).forEach(item => {
                const cartItem = document.createElement('div');
                cartItem.className = 'bg-white border border-rose-50 rounded-2xl p-3 flex items-center gap-3 shadow-[0_4px_15px_rgba(0,0,0,0.03)] relative pr-6 animate-scale-in hover:-translate-y-1 transition-transform cursor-default';
                
                cartItem.innerHTML = `
                    <div class="${item.color} w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-inner flex-shrink-0">
                        ${item.icon}
                    </div>
                    <div class="pr-4">
                        <p class="font-semibold text-slate-700 text-sm leading-tight">${item.title}</p>
                        <p class="text-xs text-slate-400">¡Que lo disfrutes!</p>
                    </div>
                    ${item.quantity > 1 ? `
                        <div class="absolute -top-2 -right-2 bg-rose-400 text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center border-2 border-white shadow-sm z-10">
                            x${item.quantity}
                        </div>
                    ` : ''}
                `;
                cartContainer.appendChild(cartItem);
            });
        }

        // Initialize
        renderVouchers();
        renderCart();
    </script>
</body>
</html>
